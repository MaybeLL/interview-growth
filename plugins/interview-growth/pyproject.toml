[project]
name = "interview-growth"
version = "0.7.1"
description = "Local evidence-based interview growth system for coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11,<3",
]

[project.scripts]
interview-growth = "interview_growth.cli:main"
interview-growth-hook = "interview_growth.hook_cli:main"

[dependency-groups]
dev = [
  "pyright>=1.1.400,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pyyaml>=6,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_growth"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
